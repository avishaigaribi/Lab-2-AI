<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Target Dash</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101522;
      color: #f5f7ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #253455 0, #101522 65%);
    }
    .game { width: min(760px, 100%); }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.35rem); letter-spacing: -.04em; }
    .hint { margin: 5px 0 0; color: #aab4ce; font-size: .95rem; }
    .score-box {
      flex: 0 0 auto;
      padding: 9px 16px;
      border: 1px solid #34415e;
      border-radius: 14px;
      background: #1a2233;
      text-align: right;
    }
    .score-label { display: block; color: #aab4ce; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    #score { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    #arena {
      position: relative;
      height: min(62vh, 460px);
      min-height: 300px;
      overflow: hidden;
      border: 1px solid #354361;
      border-radius: 22px;
      background-color: #151d2d;
      background-image: radial-gradient(#36415a 1px, transparent 1px);
      background-size: 22px 22px;
      box-shadow: 0 22px 70px #0005, inset 0 0 55px #0a0e18aa;
      touch-action: manipulation;
    }
    #target {
      position: absolute;
      left: 50%; top: 50%;
      width: 62px; height: 62px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: white;
      font-size: 1.35rem;
      cursor: crosshair;
      background: radial-gradient(circle at 35% 30%, #fff8 0 7%, #ff718d 9% 24%, #ed315e 48%, #a70f43 74%);
      box-shadow: 0 0 0 7px #ed315e24, 0 0 28px #ff396c99, inset -5px -7px 10px #74143666;
      transform: translate(-50%, -50%);
      transition: left 450ms cubic-bezier(.2,.8,.2,1), top 450ms cubic-bezier(.2,.8,.2,1), scale 120ms ease;
      user-select: none;
    }
    #target:hover { scale: 1.1; }
    #target:active { scale: .88; }
    #target:focus-visible { outline: 3px solid white; outline-offset: 8px; }
    .footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; color: #8e9ab6; font-size: .83rem; }
    #message { color: #c7d0e6; }
    @media (max-width: 480px) {
      body { padding: 16px; }
      header { align-items: center; }
      #arena { min-height: 330px; }
      .footer { flex-direction: column; gap: 3px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div>
        <h1>Target Dash</h1>
        <p class="hint">Click the moving target to score.</p>
      </div>
      <div class="score-box" aria-live="polite">
        <span class="score-label">Score</span>
        <span id="score">0</span>
      </div>
    </header>
    <section id="arena" aria-label="Game area">
      <button id="target" type="button" aria-label="Moving target">✦</button>
    </section>
    <div class="footer">
      <span id="message">Ready? Take your best shot.</span>
      <span>The target moves every second.</span>
    </div>
  </main>
  <script>
    const arena = document.querySelector('#arena');
    const target = document.querySelector('#target');
    const scoreDisplay = document.querySelector('#score');
    const message = document.querySelector('#message');
    let score = 0;

    function moveTarget() {
      const inset = 38;
      const x = inset + Math.random() * Math.max(0, arena.clientWidth - inset * 2);
      const y = inset + Math.random() * Math.max(0, arena.clientHeight - inset * 2);
      target.style.left = `${x}px`;
      target.style.top = `${y}px`;
    }

    target.addEventListener('click', () => {
      score += 1;
      scoreDisplay.textContent = score;
      message.textContent = score === 1 ? 'Nice shot!' : 'Keep it up!';
      moveTarget();
    });

    window.addEventListener('resize', moveTarget);
    moveTarget();
    window.setInterval(moveTarget, 1000);
  </script>
</body>
</html>
